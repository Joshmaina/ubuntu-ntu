# Gĩkũyũ (Kikuyu) — pilot language.
#
# ⚠️  PROVISIONAL CONTENT — NOT VALIDATED BY A NATIVE SPEAKER.
#
# Everything under content/ki/ exists to exercise the pipeline during
# development. It is drawn from published reference material, but the author is
# not a Gĩkũyũ speaker and none of it has been reviewed by one.
#
# It MUST NOT be published. Two gates enforce this rather than relying on
# anyone remembering:
#   1. every lesson carries `validated: false`
#   2. dialects/central.yaml has `authority.name: null`
# The bundle builder refuses to publish either.
#
# Replacing this with speaker-validated content is a prerequisite for public
# release — see docs/09-DATA-GOVERNANCE.md.

code: ki
name: Gikuyu
nativeName: Gĩkũyũ
isTonal: true

# Geographic scope (ADR-0009). Gĩkũyũ is one of the genuinely single-country
# African languages, so alsoSpokenIn is empty — but the field is REQUIRED so
# that authors state this consciously rather than by omission. Most African
# languages are cross-border: Swahili spans KE/TZ/UG/CD/RW/BI, Somali SO/ET/KE/DJ,
# Hausa NG/NE/GH/CM.
countryCode: KE
alsoSpokenIn: []

toneSystem:
  levels: [low, high]
  # Tone is NOT written in standard Gĩkũyũ orthography. This is precisely why
  # the pitch-contour feature has real value here: the writing genuinely does
  # not tell a learner what the pitch should be, so it cannot be inferred from
  # text and must come from speaker recordings.
  markedInOrthography: false

scripts: [latin]
anchorLanguages: [en, sw]
