name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, purity, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the pnpm version is declared once, in
      # package.json "packageManager". Specifying it in both places is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # ADR-0002: packages/core must import nothing. A build failure here is
      # the mechanism that keeps client and server incapable of diverging.
      - name: Core purity check (ADR-0002)
        run: pnpm check:purity

      # NFR-052: malformed content cannot merge. This is what makes the
      # "linguists edit through GitHub PRs" workflow (ADR-0004) safe.
      - name: Validate content
        run: pnpm validate:content

      # NFR-061: 100% line and branch coverage, enforced by threshold.
      - name: Tests with coverage threshold
        run: pnpm test:coverage

  database:
    name: Docker stack, migrate, seed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start stack
        run: docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if node scripts/check-containers.mjs; then exit 0; fi
            echo "waiting for containers... ($i/30)"
            sleep 5
          done
          echo "::error::Containers did not become healthy in 150s"
          docker compose ps
          docker compose logs --tail=50
          exit 1

      # M2 gate: schema applies cleanly to an empty database and content loads.
      # Runs against a fresh container every time, so "works on my machine"
      # drift cannot hide here.
      - name: Migrate
        run: pnpm migrate
        env:
          UBUNTU_NTU_DATABASE_URL: postgresql://ubuntuntu_admin:ubuntuntu_local_dev@localhost:5433/ubuntuntu_dev

      - name: Seed
        run: pnpm seed
        env:
          UBUNTU_NTU_DATABASE_URL: postgresql://ubuntuntu_admin:ubuntuntu_local_dev@localhost:5433/ubuntuntu_dev

      # Idempotency: a second run must be a no-op, not a failure.
      - name: Re-run migrate and seed (idempotency)
        run: pnpm migrate && pnpm seed
        env:
          UBUNTU_NTU_DATABASE_URL: postgresql://ubuntuntu_admin:ubuntuntu_local_dev@localhost:5433/ubuntuntu_dev

      # M3 gate. These run against a REAL Postgres on purpose: the idempotency
      # guarantee is a primary key plus ON CONFLICT, so a mocked database would
      # be testing the mock rather than the guarantee.
      - name: API integration tests
        run: pnpm --filter @ubuntu-ntu/api test
        env:
          UBUNTU_NTU_DATABASE_URL: postgresql://ubuntuntu_admin:ubuntuntu_local_dev@localhost:5433/ubuntuntu_dev
          JWT_ACCESS_SECRET: ci-access-secret-long-enough-for-validation
          JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-for-validation

      # The spec is generated, so a stale committed copy is a real defect.
      - name: OpenAPI spec is up to date
        run: |
          pnpm --filter @ubuntu-ntu/api openapi
          if ! git diff --exit-code --quiet docs/OPENAPI.yaml; then
            echo "::error::docs/OPENAPI.yaml is stale. Run: pnpm --filter @ubuntu-ntu/api openapi"
            git diff docs/OPENAPI.yaml
            exit 1
          fi
        env:
          UBUNTU_NTU_DATABASE_URL: postgresql://ubuntuntu_admin:ubuntuntu_local_dev@localhost:5433/ubuntuntu_dev
          JWT_ACCESS_SECRET: ci-access-secret-long-enough-for-validation
          JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-for-validation

      - name: Tear down
        if: always()
        run: docker compose down -v
