# UBUNTU-NTU local development stack.
# Container and credential naming follows the project brief §3D.
# Everything here is free and runs locally — see docs/10-DEPENDENCIES.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ubuntuntu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubuntuntu_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ubuntuntu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubuntuntu_local_dev}
      # Deterministic collation so ORDER BY is identical across machines —
      # matters for event replay ordering (docs/08-SYNC-PROTOCOL.md §7).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # HOST port defaults to 5433, not 5432, deliberately.
      #
      # A native PostgreSQL install on the developer's machine binds 5432 and
      # wins the port; Docker's mapping then silently loses and every client
      # connects to the WRONG database. That failure is nasty because it looks
      # like a schema bug ("relation already exists") rather than a connection
      # problem. Defaulting off the well-known port removes the ambiguity.
      #
      # The CONTAINER port stays 5432 so nothing inside the network changes.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ubuntuntu_admin} -d ${POSTGRES_DB:-ubuntuntu_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ubuntuntu_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  storage:
    image: minio/minio:latest
    container_name: ubuntuntu_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ubuntuntu_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ubuntuntu_local_dev}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: ubuntuntu_postgres_data
  redis_data:
    name: ubuntuntu_redis_data
  storage_data:
    name: ubuntuntu_storage_data
